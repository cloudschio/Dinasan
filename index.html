<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Jadwal Dinasan Staf KAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0b1220, #0f172a 40%, #0b1220);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .controls input,
    .controls select,
    .controls button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .controls input:focus,
    .controls select:focus,
    .controls button:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .controls button {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      color: #0b1220;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .controls button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: radial-gradient(180deg, #1f2a40, #162033);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      border-color: #3b82f6;
    }

    .card .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 10px;
      color: #f1f5f9;
    }

    .card .meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .card .meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card .meta .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .card .desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .card .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status {
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .status.dinas {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .status.libur {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .status.off {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px 40px;
      }
      .controls {
        gap: 8px;
      }
      .controls input,
      .controls select,
      .controls button {
        padding: 8px 10px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Jadwal Dinasan Staf KAI</h1>
      <p>Daftar tugas dinas luar dan penugasan staf per periode</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Cari nama staf / lokasi..." />
      <select id="filterStatus">
        <option value="">Semua Status</option>
        <option value="Dinas">Dinas</option>
        <option value="Libur">Libur / Cuti</option>
        <option value="Off">Off</option>
      </select>
      <select id="sortBy">
        <option value="dateAsc">Urut: Tanggal (Asc)</option>
        <option value="dateDesc">Urut: Tanggal (Desc)</option>
        <option value="nameAsc">Urut: Nama (A–Z)</option>
        <option value="nameDesc">Urut: Nama (Z–A)</option>
      </select>
      <button id="refreshBtn">Refresh Data</button>
    </div>

    <div id="scheduleGrid" class="grid">
      <!-- Kartu jadwal akan dirender di sini oleh JavaScript -->
    </div>

    <footer>
      Data contoh — sesuaikan dengan jadwal dinasan staf KAI yang sebenarnya.
    </footer>
  </div>

  <script>
    // ===== DATA JADWAL DINASAN (EDIT DI SINI) =====
    const jadwalData = [
      {
        id: 1,
        nama: "Fitrah Ramadhani",
        jabatan: "Operasional",
        lokasi: "Stasiun Surabaya Gubeng",
        tanggalMulai: "2026-09-24",
        tanggalSelesai: "2026-09-26",
        keterangan: "Pemberkasan & Acara Intern HUT 81 KAI",
        status: "Dinas" // Dinas | Libur | Off
      },
      {
        id: 2,
        nama: "Fitrah Ramadhani",
        jabatan: "Operasional",
        lokasi: "Klinik MedisKA",
        tanggalMulai: "2026-09-23",
        tanggalSelesai: "2026-09-23",
        keterangan: "Medical CheckUp",
        status: "Dinas"
      },
      {
        id: 3,
        nama: "Fitrah Ramadhani",
        jabatan: "Operasional",
        lokasi: "Kantor Pusat PT KAI Daop 2 BD",
        tanggalMulai: "2026-09-28",
        tanggalSelesai: "2026-09-28",
        keterangan: "Upacara HUT 81 KAI [WAJIB]",
        status: "Luar Dinas"
      },
    ];

    // ===== RENDER & FILTER =====
    const gridEl = document.getElementById("scheduleGrid");
    const searchInput = document.getElementById("searchInput");
    const filterStatus = document.getElementById("filterStatus");
    const sortBy = document.getElementById("sortBy");
    const refreshBtn = document.getElementById("refreshBtn");

    function formatDate(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      const options = { weekday: "short", day: "2-digit", month: "short", year: "numeric" };
      return d.toLocaleDateString("id-ID", options);
    }

    function renderCards(data) {
      gridEl.innerHTML = "";
      if (data.length === 0) {
        gridEl.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; color: var(--muted); padding: 40px 10px;">
            Tidak ada data jadwal yang cocok dengan filter.
          </div>
        `;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const badgeText = item.status === "Dinas" ? "DINAS" : item.status === "Libur" ? "LIBUR" : "OFF";
        const statusClass = item.status.toLowerCase();

        card.innerHTML = `
          <div class="badge">${badgeText}</div>
          <h3>${item.nama}</h3>
          <div class="meta">
            <span><span class="dot"></span> ${item.jabatan}</span>
            <span>📍 ${item.lokasi}</span>
            <span>📅 ${formatDate(item.tanggalMulai)} ${item.tanggalMulai !== item.tanggalSelesai ? "– " + formatDate(item.tanggalSelesai) : ""}</span>
          </div>
          <div class="desc">${item.keterangan}</div>
          <div class="footer">
            <span>ID: #${item.id}</span>
            <span class="status ${statusClass}">${item.status}</span>
          </div>
        `;

        gridEl.appendChild(card);
      });
    }

    function getFilteredAndSorted() {
      let data = [...jadwalData];

      const q = searchInput.value.trim().toLowerCase();
      if (q) {
        data = data.filter(d =>
          d.nama.toLowerCase().includes(q) ||
          d.lokasi.toLowerCase().includes(q) ||
          d.jabatan.toLowerCase().includes(q) ||
          d.keterangan.toLowerCase().includes(q)
        );
      }

      const statusVal = filterStatus.value;
      if (statusVal) {
        data = data.filter(d => d.status === statusVal);
      }

      const sortVal = sortBy.value;
      data.sort((a, b) => {
        if (sortVal === "dateAsc") {
          return new Date(a.tanggalMulai) - new Date(b.tanggalMulai);
        } else if (sortVal === "dateDesc") {
          return new Date(b.tanggalMulai) - new Date(a.tanggalMulai);
        } else if (sortVal === "nameAsc") {
          return a.nama.localeCompare(b.nama, "id");
        } else if (sortVal === "nameDesc") {
          return b.nama.localeCompare(a.nama, "id");
        }
        return 0;
      });

      return data;
    }

    function refresh() {
      const data = getFilteredAndSorted();
      renderCards(data);
    }

    searchInput.addEventListener("input", refresh);
    filterStatus.addEventListener("change", refresh);
    sortBy.addEventListener("change", refresh);
    refreshBtn.addEventListener("click", () => {
      searchInput.value = "";
      filterStatus.value = "";
      sortBy.value = "dateAsc";
      refresh();
    });

    // Render awal
    refresh();
  </script>
</body>
</html>
